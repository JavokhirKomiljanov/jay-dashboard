const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), b64=a=>btoa(String.fromCharCode(...a));
const sub=crypto.subtle;
async function open_(raw,name){
  const k=await sub.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const gz=await sub.decrypt({name:'AES-GCM',iv:u8(B.i)},k,u8(B.c));
  let html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  html=html.replace('/*__USER__*/null',JSON.stringify(name)).replace('<script>','<script>window.NYC_LOGOUT=()=>{try{localStorage.removeItem("'+AK+'")}catch(_){}location.reload()};</'+'script><script>');
  document.open();document.write(html);document.close();
}
async function login(user,pw){
  const mat=await sub.importKey('raw',new TextEncoder().encode(user.trim().toLowerCase()+'\n'+pw),'PBKDF2',false,['deriveKey']);
  for(const a of B.a){
    const kek=await sub.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:u8(a.s),iterations:B.n},mat,{name:'AES-GCM',length:256},false,['decrypt']);
    try{const out=new Uint8Array(await sub.decrypt({name:'AES-GCM',iv:u8(a.i)},kek,u8(a.w)));return[out.slice(0,32),new TextDecoder().decode(out.slice(32))]}catch(_){}
  }
  return null;
}
