.eb{color:#05a884;letter-spacing:2.5px;font-size:11px;font-weight:700;text-transform:uppercase}
label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-top:14px}

.rm{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--body)}
button{margin-top:18px;width:100%;border:0;border-radius:999px;padding:13px;background:var(--mint);color:#131313;font:700 15px Inter;cursor:pointer}
button:disabled{opacity:.6}#err{color:var(--err);min-height:20px;margin-top:10px;font-size:13px}

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), b64=a=>btoa(String.fromCharCode(...a));
const sub=crypto.subtle;
async function open_(raw,name){
  const k=await sub.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const gz=await sub.decrypt({name:'AES-GCM',iv:u8(B.i)},k,u8(B.c));
  let html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  html=html.replace('/*__USER__*/null',JSON.stringify(name)).replace('<script>','<script>window.NYC_LOGOUT=()=>{try{localStorage.removeItem("'+AK+'")}catch(_){}location.reload()};</'+'script><script>');
  document.open();document.write(html);document.close();
}
async function login(user,pw){
  const mat=await sub.importKey('raw',new TextEncoder().encode(user.trim().toLowerCase()+'\n'+pw),'PBKDF2',false,['deriveKey']);
  for(const a of B.a){
    const kek=await sub.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:u8(a.s),iterations:B.n},mat,{name:'AES-GCM',length:256},false,['decrypt']);
    try{const out=new Uint8Array(await sub.decrypt({name:'AES-GCM',iv:u8(a.i)},kek,u8(a.w)));return[out.slice(0,32),new TextDecoder().decode(out.slice(32))]}catch(_){}
  }
  return null;
}
(async()=>{try{const s=JSON.parse(localStorage.getItem(AK)||'null');if(s)await open_(u8(s.k),s.n)}catch(_){try{localStorage.removeItem(AK)}catch(_){}}})();
document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();const b=document.getElementById('b'),e=document.getElementById('err');
  b.disabled=true;b.textContent='Проверяю…';e.textContent='';
  try{const r=await login(document.getElementById('u').value,document.getElementById('p').value);
    if(!r){e.textContent='Неверный логин или пароль';return}
    if(document.getElementById('r').checked){try{localStorage.setItem(AK,JSON.stringify({k:b64(r[0]),n:r[1]}))}catch(_){}}
    await open_(r[0],r[1]);
  }catch(x){e.textContent='Ошибка: '+x}finally{b.disabled=false;b.textContent='Войти'}};
