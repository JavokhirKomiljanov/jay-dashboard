<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jay OS — YouTube</title>
<style>
:root{--bg:#f6faf8;--card:#fff;--fg:#13231d;--mut:#5b6f67;--line:#d9e6e0;--acc:#0f9d76;--acc-s:#e1f4ec;--warn:#b4570b;--warn-s:#fbeedd;--bad:#b3261e;--bad-s:#fde7e5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Onest,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:18px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.mut{color:var(--mut)}.small{font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--mut)}
.ep{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:74px 1fr;gap:14px}
.ep .d b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.ep .d span{font-size:12px;color:var(--mut)}
.ep h3{margin:0;font-size:16px;line-height:1.35}
.body{display:flex;flex-direction:column;gap:8px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.chip.ok{background:var(--acc-s);border-color:transparent;color:#0a6b50}.chip.warn{background:var(--warn-s);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--bad-s);border-color:transparent;color:var(--bad)}
a{color:var(--acc)}a.chip{text-decoration:none;color:var(--acc);border-color:var(--acc)}
button{font:inherit;font-size:12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
ul{margin:0;padding-left:18px}li{margin:2px 0}
.todo{background:var(--warn-s);border-radius:12px;padding:12px 16px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mut);font-weight:600}
tr:last-child td{border-bottom:0}.tw{overflow-x:auto}
code{font:12px ui-monospace,Consolas,monospace;background:var(--bg);padding:1px 5px;border-radius:5px;word-break:break-all}
@media(max-width:560px){.ep{grid-template-columns:1fr;gap:6px}}
</style></head><body><div class="wrap" id="app"></div>
<script>
const D = /*__DATA__*/{};
const KEY = 'jos7-youtube';
let ST = {}; try { ST = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} };
function copy(t, b){ const done = () => { const o = b.textContent; b.textContent = 'Скопировано'; setTimeout(() => b.textContent = o, 1200); };
  try { navigator.clipboard.writeText(t).then(done, () => prompt('Путь', t)); } catch (e) { prompt('Путь', t); } }
function render(){
  const v = D.videos || [], shot = v.filter(x => (ST[x.n] || {}).shot).length, live = v.filter(x => (ST[x.n] || {}).live).length;
  const scripts = v.filter(x => x.script_url).length, next = v.find(x => !(ST[x.n] || {}).live);
  let h = `<div><h1>📺 YouTube — план на ноябрь и декабрь</h1><div class="mut small">Одно видео в неделю, вторник 19:00 · собрано ${esc(D.built)} · отметки «Снято/Вышло» хранятся в этом браузере</div></div>`;
  h += `<div class="kpis"><div class="kpi"><b>${scripts}/${v.length}</b><span>сценариев готово</span></div><div class="kpi"><b>${shot}/${v.length}</b><span>снято</span></div><div class="kpi"><b>${live}/${v.length}</b><span>вышло</span></div><div class="kpi"><b>${next ? esc(next.date) : '—'}</b><span>ближайшее невышедшее</span></div></div>`;
  const todo = v.flatMap(x => (x.blockers || []).map(b => ({n: x.n, date: x.date, b}))).filter(t => !(ST[t.n] || {}).live);
  if (todo.length) h += `<div class="todo"><h2 style="color:var(--warn)">Что нужно до съёмки</h2><ul>${todo.map(t => `<li><b>${esc(t.date)}</b> — ${esc(t.b)}</li>`).join('')}</ul></div>`;
  h += `<h2>Видео</h2>`;
  for (const x of v) { const s = ST[x.n] || {};
    h += `<div class="ep"><div class="d"><b>${esc(x.date)}</b><span>видео ${x.n}</span></div><div class="body">
      <div class="row"><span class="chip">${esc(x.tag)}</span>${x.script_url ? '<span class="chip ok">сценарий готов</span>' : '<span class="chip warn">сценария нет</span>'}${x.demo ? `<span class="chip ${x.demo_ok ? 'ok' : 'warn'}">${esc(x.demo)}</span>` : ''}</div>
      <h3>${esc(x.title)}</h3>
      <div class="small mut">Подарок: ${esc(x.gift)}</div>
      <div class="row">${x.script_url ? `<a class="chip" href="${esc(x.script_url)}" target="_blank" rel="noopener">Сценарий ↗</a>` : ''}${x.script_path ? `<button data-copy="${esc(x.script_path)}">📋 путь к файлу</button>` : ''}
        <button data-t="shot" data-n="${x.n}" aria-pressed="${!!s.shot}">Снято</button><button data-t="live" data-n="${x.n}" aria-pressed="${!!s.live}">Вышло</button></div>
      <div class="small mut">Источник: ${esc(x.source || 'нет источника')}</div></div></div>`; }
  h += `<h2>Демо и материалы</h2><div class="tw"><table><tr><th>Что</th><th>Для видео</th><th>Где</th><th>Состояние</th></tr>${(D.assets || []).map(a => `<tr><td><b>${esc(a.name)}</b></td><td>${esc(a.video)}</td><td><code>${esc(a.where)}</code></td><td>${esc(a.state)}</td></tr>`).join('')}</table></div>`;
  h += `<h2>Правила роликов</h2><ul>${(D.rules || []).map(r => `<li>${esc(r)}</li>`).join('')}</ul>`;
  h += `<div class="small mut">План целиком: <a href="${esc(D.plan_url)}" target="_blank" rel="noopener">страница плана ↗</a> · папка <code>${esc(D.folder)}</code></div>`;
  document.getElementById('app').innerHTML = h;
  try { parent.postMessage({jos: 'h', page: 'youtube', h: document.documentElement.scrollHeight}, '*'); } catch (e) {}
}
document.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.copy) return copy(b.dataset.copy, b);
  if (b.dataset.t) { const n = b.dataset.n; ST[n] = ST[n] || {}; ST[n][b.dataset.t] = !ST[n][b.dataset.t]; save(); render(); } });
render(); window.addEventListener('resize', render);
</script></body></html>
