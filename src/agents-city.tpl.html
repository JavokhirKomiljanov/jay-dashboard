<html lang="ru">
<head>
<meta charset="utf-8">

<title>Jay OS — Город агентов · Ташкент</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#1a1410;font-family:Manrope,system-ui,sans-serif;color:#fff6e8}
#c{position:fixed;inset:0}
.hud{position:fixed;left:18px;top:16px;z-index:5;max-width:min(560px,92vw);pointer-events:none}
.hud .eb{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#19d3c5;text-shadow:0 1px 8px #0008}
.hud h1{font-size:27px;font-weight:800;margin:4px 0 2px;text-shadow:0 2px 18px #000a,0 0 2px #0008}
.hud p{font-size:13px;color:#ffe9c9;text-shadow:0 1px 8px #000a}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;pointer-events:auto}
.chip{font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;background:#1a1410aa;border:1px solid #ffffff2a;backdrop-filter:blur(8px);cursor:pointer;color:#fff3dc}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.chip.on{background:#19d3c544;border-color:#19d3c5}
.top{position:fixed;right:16px;top:16px;z-index:6;display:flex;gap:8px}
.btn{background:#fff6e8;color:#1a1410;border:0;border-radius:12px;padding:9px 14px;font:700 13px Manrope;cursor:pointer;box-shadow:0 6px 24px #0007}
.btn.ghost{background:#1a1410aa;color:#fff;border:1px solid #ffffff30;backdrop-filter:blur(8px)}
.panel{position:fixed;right:16px;bottom:16px;z-index:6;width:min(360px,calc(100vw - 32px));background:#1b1612f0;border:1px solid #d9a44155;border-radius:18px;padding:16px 18px;backdrop-filter:blur(10px);box-shadow:0 18px 60px #000a;display:none}
.panel.on{display:block;animation:up .25s ease}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.panel .em{font-size:34px}
.panel h3{font-size:19px;margin:4px 0}
.panel .pl{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;margin-bottom:8px}
.panel dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:12.5px;margin-top:6px}
.panel dt{color:#b89c72}.panel dd{color:#fff3dc}
.panel .row{display:flex;gap:8px;margin-top:12px}
.lbl{font:800 12px Manrope;color:#fff;padding:5px 10px;border-radius:10px;background:#1a1410cc;border:1px solid #ffffff2a;white-space:nowrap;transform:translateY(-8px);cursor:pointer;backdrop-filter:blur(4px)}
.lbl.d{font-size:14px;padding:7px 13px;background:linear-gradient(135deg,#2a211aee,#140f0cee);border-color:#d9a44188;color:#ffe7b0;letter-spacing:.02em}
.lbl.d small{display:block;font-size:10px;font-weight:600;color:#c7b58a;letter-spacing:.06em}
.lbl.a{font-size:11px;padding:3px 8px;opacity:0;transition:opacity .25s}
.lbl.a.show{opacity:1}
.lbl.lm{font-size:10px;padding:3px 8px;background:#19d3c5cc;color:#06211f;border-color:#fff8;letter-spacing:.04em;opacity:0;transition:opacity .3s;pointer-events:none!important}
.lbl.lm.show{opacity:1}
.office{position:fixed;inset:0;z-index:8;display:none}
.office.on{display:block}
body.in-office .hud,body.in-office .top,body.in-office .legend,body.in-office .hint{display:none}
.office .bar{position:fixed;left:16px;top:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;z-index:9}
.office .bar h2{font-size:22px;text-shadow:0 2px 14px #000}
.office .bar p{font-size:13px;color:#ffe9c9;max-width:520px;text-shadow:0 1px 8px #000}
.legend{position:fixed;left:18px;bottom:16px;z-index:5;font-size:11.5px;color:#ffe9c9;display:flex;gap:12px;flex-wrap:wrap;max-width:60vw;text-shadow:0 1px 6px #000}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:5;font-size:12px;color:#ffe9c9;background:#1a1410aa;padding:6px 12px;border-radius:999px;backdrop-filter:blur(6px)}
.vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 45%,transparent 50%,#1a141066 100%)}
@media(max-width:700px){.hud h1{font-size:20px}.hud p{font-size:12px}.legend{display:none}.hint{display:none}.lbl.d{font-size:11px;padding:4px 8px}.lbl.d small{font-size:9px}
  .top{top:auto;bottom:12px;left:12px;right:12px;justify-content:space-between}.top .btn{padding:8px 11px;font-size:12px}.panel{bottom:60px;max-height:46vh;overflow:auto;padding:12px 14px}.panel .em{font-size:26px}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas><div class="vig"></div>
<div class="hud">
  <div class="eb">Jay OS · Agents House</div>
  <h1>Город агентов · Ташкент</h1>
  <p id="sum"></p>
  <div class="chips" id="chips"></div>
</div>
<div class="top"><button class="btn ghost" id="tour">▶ Облёт</button><button class="btn ghost" id="home">⌂ Весь город</button><a class="btn" href="index.html#agents" target="_top" style="text-decoration:none">← JOS</a></div>
<div class="panel" id="panel"></div>
<div class="legend"><span><i style="background:#22e07a"></i>работает сейчас</span><span><i style="background:#19d3c5"></i>по расписанию</span><span><i style="background:#f5a623"></i>разовая, сделано</span><span><i style="background:#8b8f99"></i>выключен</span><span id="chk"></span></div>
<div class="hint">Крути мышью / пальцем · колесо — ближе · клик по зданию — офис агента</div>
<div class="office" id="office"><div class="bar"><div><h2 id="oname"></h2><p id="odesc"></p></div><button class="btn" id="oback">← В город</button></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const D = /*__DATA__*/{};
const ST = {running:['работает сейчас','#22e07a'], ready:['по расписанию','#19d3c5'], done:['сделано (разовая)','#f5a623'], off:['выключен','#8b8f99']};
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cnt = s => D.agents.filter(a=>a.state===s).length;
document.getElementById('sum').textContent = `${D.agents.length} агентов в ${D.districts.length} районах: ${cnt('running')} работают сейчас, ${cnt('ready')} по расписанию.`;
document.getElementById('chk').textContent = 'проверено ' + D.checked;
const MOBILE = Math.min(innerWidth, innerHeight) < 700;

/* ---------- renderer, scene, camera ---------- */
const canvas = document.getElementById('c');
const R = new THREE.WebGLRenderer({canvas, antialias:!MOBILE, powerPreference:'high-performance'});
R.setPixelRatio(Math.min(devicePixelRatio, MOBILE?1.5:2)); R.setSize(innerWidth, innerHeight);
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.12;
const L2 = new CSS2DRenderer(); L2.setSize(innerWidth, innerHeight);
Object.assign(L2.domElement.style, {position:'fixed', inset:'0', pointerEvents:'none', zIndex:4});
document.body.appendChild(L2.domElement);

const scene = new THREE.Scene();
const FOG = new THREE.Color('#e3a06a'); scene.fog = new THREE.Fog(FOG, 280, 640);
const cam = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.5, 1400);
const HOME = {p:new THREE.Vector3(10, MOBILE?250:158, MOBILE?330:226), t:new THREE.Vector3(0, 6, -2)};
cam.position.copy(HOME.p);
const ctl = new OrbitControls(cam, L2.domElement); L2.domElement.style.pointerEvents = 'auto';
ctl.enableDamping = true; ctl.maxPolarAngle = Math.PI*0.47; ctl.minDistance = 14; ctl.maxDistance = 460; ctl.target.copy(HOME.t);

/* golden-hour sky dome: orange horizon -> warm rose -> deep indigo zenith, sun glow, faint stars */
{ const g = new THREE.SphereGeometry(900, 32, 16);
  const m = new THREE.ShaderMaterial({side:THREE.BackSide, depthWrite:false, fog:false, uniforms:{sunDir:{value:new THREE.Vector3(-0.55,0.18,-0.8).normalize()}},
    vertexShader:`varying vec3 v;void main(){v=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`varying vec3 v;uniform vec3 sunDir;void main(){float h=clamp(v.y*1.6+.12,0.,1.);
      vec3 hor=vec3(.96,.62,.36), mid=vec3(.72,.40,.44), top=vec3(.10,.12,.30);
      vec3 col=mix(mix(hor,mid,smoothstep(0.,.28,h)),top,smoothstep(.28,1.,h));
      float s=max(dot(v,sunDir),0.); col+=vec3(1.,.82,.55)*pow(s,40.)*1.4+vec3(1.,.6,.3)*pow(s,6.)*.35;
      gl_FragColor=vec4(col,1.);}`});
  scene.add(new THREE.Mesh(g, m));
  const sp = []; for(let i=0;i<500;i++){ const t=Math.random()*Math.PI*2, y=0.45+Math.random()*0.55, r=Math.sqrt(1-y*y); sp.push(Math.cos(t)*r*850, y*850, Math.sin(t)*r*850); }
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({color:'#ffffff', size:1.3, sizeAttenuation:false, transparent:true, opacity:.45, fog:false}))); }

/* lights: low warm sun from the west, sky fill, turquoise rim from the east */
scene.add(new THREE.HemisphereLight('#f5c6a0', '#5a3b22', 0.62));
const sun = new THREE.DirectionalLight('#ffc98a', 1.7); sun.position.set(-140, 105, 110); sun.castShadow = true;
sun.shadow.mapSize.set(MOBILE?1024:2048, MOBILE?1024:2048); Object.assign(sun.shadow.camera, {left:-170, right:170, top:170, bottom:-170, near:10, far:600}); sun.shadow.bias=-0.0006; scene.add(sun);
const rim = new THREE.DirectionalLight('#5fd6ff', 0.45); rim.position.set(140, 70, -120); scene.add(rim);

/* ---------- textures made in canvas (no external assets) ---------- */
function canvasTex(w, h, draw, rep){ const c = document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; if(rep){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } t.anisotropy = 4; return t; }
let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
/* 8-point star lattice (girih) — the Tashkent "panjara" sun-screen pattern */
function starLattice(g, w, h, cell, col, lw){ g.strokeStyle=col; g.lineWidth=lw; for(let y=0;y<h;y+=cell) for(let x=0;x<w;x+=cell){ const cx=x+cell/2, cy=y+cell/2, r=cell*.42;
  g.beginPath(); for(let k=0;k<16;k++){ const a=k/16*Math.PI*2, rr=k%2?r*.45:r; g.lineTo(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr); } g.closePath(); g.stroke();
  g.beginPath(); g.rect(x,y,cell,cell); g.stroke(); } }
/* modernist facade: ochre concrete + panjara screen + window bands (lit at golden hour) */
const panjaraTex = (base='#e4cfa6', lit=.55) => canvasTex(256, 512, (g,w,h)=>{ g.fillStyle=base; g.fillRect(0,0,w,h);
  g.globalAlpha=.28; starLattice(g, w, h, 64, '#9a7a4a', 2.2); g.globalAlpha=1;
  for(let y=12;y<h-10;y+=40){ for(let x=12;x<w-8;x+=48){ g.fillStyle = rnd()<lit ? ['#ffd98f','#ffc96a','#fff0c8'][Math.floor(rnd()*3)] : '#3b4452'; g.fillRect(x,y,28,18); g.fillStyle='#b89c72'; g.fillRect(x-2,y+18,32,3); } }
  g.fillStyle='#c9a86f'; for(let y=0;y<h;y+=40) g.fillRect(0,y-2,w,3); });
/* Hotel Uzbekistan: 17 floors of pointed-arch concrete frames over dark glass */
const hotelTex = canvasTex(1024, 384, (g,w,h)=>{ g.fillStyle='#2a3240'; g.fillRect(0,0,w,h); const cols=36, rows=17, cw=w/cols, rh=h/rows;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){ const x=c*cw, y=r*rh; g.fillStyle = rnd()<.5?'#ffd48a':'#1f2733'; g.fillRect(x+3,y+3,cw-6,rh-5);
    g.strokeStyle='#efe6d4'; g.lineWidth=3; g.beginPath(); g.moveTo(x+2,y+rh); g.lineTo(x+2,y+rh*.45); g.quadraticCurveTo(x+2,y+2,x+cw/2,y+1); g.quadraticCurveTo(x+cw-2,y+2,x+cw-2,y+rh*.45); g.lineTo(x+cw-2,y+rh); g.stroke(); }
  g.fillStyle='#efe6d4'; g.fillRect(0,0,w,4); g.fillRect(0,h-5,w,5); });
/* white tower with arched openings (Chimes / Palace of Forums / Kukeldash) */
const archTex = (base='#f3ecdd', n=3) => canvasTex(128, 512, (g,w,h)=>{ g.fillStyle=base; g.fillRect(0,0,w,h);
  for(let i=0;i<n;i++){ const y=60+i*140, aw=46, ah=100, x=(w-aw)/2; g.fillStyle='#1b2130'; g.beginPath(); g.moveTo(x,y+ah); g.lineTo(x,y+ah*.4); g.quadraticCurveTo(x,y,x+aw/2,y); g.quadraticCurveTo(x+aw,y,x+aw,y+ah*.4); g.lineTo(x+aw,y+ah); g.closePath(); g.fill();
    g.strokeStyle='#1aa9a2'; g.lineWidth=5; g.stroke(); } });
/* Chorsu dome: turquoise with ornament bands */
const chorsuTex = canvasTex(1024, 512, (g,w,h)=>{ g.fillStyle='#1fb2ad'; g.fillRect(0,0,w,h);
  const band=(y,hh,c1,c2)=>{ g.fillStyle=c1; g.fillRect(0,y,w,hh); g.fillStyle=c2; for(let x=0;x<w;x+=hh){ g.beginPath(); g.moveTo(x,y+hh); g.lineTo(x+hh/2,y); g.lineTo(x+hh,y+hh); g.closePath(); g.fill(); } };
  band(70,34,'#0f6f73','#f3ecdd'); band(170,26,'#f3ecdd','#1a3f8f'); band(290,34,'#0f6f73','#f3ecdd');
  g.strokeStyle='#0d5c5e'; g.lineWidth=3; for(let x=0;x<w;x+=64){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); } /* ribs */
  g.globalAlpha=.3; starLattice(g,w,70,35,'#f3ecdd',2); g.globalAlpha=1; });
/* majolica tile for pishtaq portals */
const tileTex = canvasTex(256, 256, (g,w,h)=>{ g.fillStyle='#1a3f8f'; g.fillRect(0,0,w,h); starLattice(g,w,h,32,'#f3ecdd',2); g.fillStyle='#1fb2ad'; for(let y=0;y<h;y+=32) for(let x=0;x<w;x+=32){ g.beginPath(); g.arc(x+16,y+16,5,0,7); g.fill(); } }, [2,4]);
/* glass towers */
const glassTex = (hue='#bfe6ff', lit=.6) => { const t=canvasTex(128, 256, (g,w,h)=>{ g.fillStyle='#3d6288'; g.fillRect(0,0,w,h); for(let y=4;y<h;y+=12) for(let x=4;x<w;x+=16){ g.fillStyle = rnd()<lit ? hue : '#2e4d6e'; g.fillRect(x,y,11,8); } g.fillStyle='#c7d8e8'; for(let x=0;x<w;x+=16) g.fillRect(x,0,2,h); }); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t; };
/* ground: warm Tashkent sand with faint block pattern */
const groundTex = canvasTex(1024, 1024, (g,w,h)=>{ g.fillStyle='#d8bf94'; g.fillRect(0,0,w,h);
  for(let i=0;i<5000;i++){ g.fillStyle=`rgba(110,80,40,${rnd()*0.10})`; g.fillRect(rnd()*w, rnd()*h, 3, 3); }
  g.fillStyle='rgba(255,240,200,.18)'; for(let i=0;i<400;i++) g.fillRect(rnd()*w, rnd()*h, 6+rnd()*30, 6+rnd()*30); }, [6,6]);
/* Amir Temur park: green circle, radial alleys, ring alley */
const parkTex = canvasTex(512, 512, (g,w,h)=>{ g.fillStyle='#4e8a3f'; g.fillRect(0,0,w,h); for(let i=0;i<1500;i++){ g.fillStyle=`rgba(20,60,10,${rnd()*.25})`; g.fillRect(rnd()*w,rnd()*h,4,4); }
  g.strokeStyle='#e7d7b3'; g.lineWidth=14; for(let k=0;k<8;k++){ const a=k/8*Math.PI*2; g.beginPath(); g.moveTo(256,256); g.lineTo(256+Math.cos(a)*256, 256+Math.sin(a)*256); g.stroke(); }
  g.lineWidth=12; g.beginPath(); g.arc(256,256,150,0,7); g.stroke(); g.beginPath(); g.arc(256,256,236,0,7); g.stroke(); g.fillStyle='#e7d7b3'; g.beginPath(); g.arc(256,256,58,0,7); g.fill(); });
/* ikat / atlas zigzag and suzani rosettes for the interiors */
const ikatTex = canvasTex(256, 256, (g,w,h)=>{ const cols=['#1c3faa','#e2b33b','#c8304a','#0e8f82','#f4ead2']; for(let y=0;y<h;y+=32){ for(let x=0;x<w;x+=16){ g.fillStyle=cols[((x/16)+(y/32))%cols.length]; g.beginPath(); g.moveTo(x,y); g.lineTo(x+8,y+16); g.lineTo(x,y+32); g.lineTo(x-8,y+16); g.closePath(); g.fill(); } } }, [3,3]);
const suzaniTex = canvasTex(512, 512, (g,w,h)=>{ g.fillStyle='#f3e7cf'; g.fillRect(0,0,w,h);
  const ros=(cx,cy,r,c1,c2)=>{ for(let k=0;k<12;k++){ const a=k/12*Math.PI*2; g.fillStyle=c2; g.beginPath(); g.ellipse(cx+Math.cos(a)*r*.62, cy+Math.sin(a)*r*.62, r*.28, r*.12, a, 0, Math.PI*2); g.fill(); }
    g.fillStyle=c1; g.beginPath(); g.arc(cx,cy,r*.45,0,Math.PI*2); g.fill(); g.fillStyle='#f3e7cf'; g.beginPath(); g.arc(cx,cy,r*.22,0,Math.PI*2); g.fill(); };
  ros(256,256,150,'#b3263a','#1d4e9e'); [[90,90],[422,90],[90,422],[422,422]].forEach(([x,y])=>ros(x,y,70,'#1d4e9e','#c58b1c'));
  g.strokeStyle='#b3263a'; g.lineWidth=10; g.strokeRect(14,14,w-28,h-28); });
const metroTex = canvasTex(128,128,(g,w,h)=>{ g.fillStyle='#1a3f8f'; g.beginPath(); g.arc(64,64,60,0,7); g.fill(); g.fillStyle='#fff'; g.font='bold 86px Arial'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('M',64,70); });
const signTex = (txt, bg='#0b1220', fg='#9be15d') => canvasTex(512,128,(g,w,h)=>{ g.fillStyle=bg; g.fillRect(0,0,w,h); g.fillStyle=fg; g.font='bold 72px Manrope, Arial'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(txt,256,68); });

/* ---------- materials & helpers ---------- */
const mat = (c, o={}) => new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.65}, o));
const TURQ = mat('#1fb2ad', {metalness:.15, roughness:.3, emissive:'#0b4f4d', emissiveIntensity:.35});
const TURQ_RIB = new THREE.MeshStandardMaterial({color:'#22b8b2', roughness:.35, flatShading:true, emissive:'#0b4f4d', emissiveIntensity:.3});
const GOLD = mat('#e3b341', {metalness:.85, roughness:.25, emissive:'#5a3d06', emissiveIntensity:.45});
const WHITE = mat('#f4eee0', {roughness:.5});
const CONCRETE = mat('#e2cfa8', {roughness:.85});
const BRONZE = mat('#8a5a2e', {metalness:.6, roughness:.4, emissive:'#3a2210', emissiveIntensity:.5});
const DARKGLASS = mat('#1b2a3d', {metalness:.6, roughness:.2});
function add(parent, geo, m, x=0, y=0, z=0, cast=true){ const ms=new THREE.Mesh(geo,m); ms.position.set(x,y,z); ms.castShadow=cast; ms.receiveShadow=true; parent.add(ms); return ms; }
/* ribbed turquoise dome (Samarkand/Tashkent style): low segment sphere cap with flat shading + gold finial */
function ribbedDome(parent, r, x, y, z, drumH=0){ if(drumH){ add(parent,new THREE.CylinderGeometry(r*.92,r*.92,drumH,24),WHITE,x,y+drumH/2,z); }
  const d=add(parent,new THREE.SphereGeometry(r,18,10,0,Math.PI*2,0,Math.PI/2),TURQ_RIB,x,y+drumH,z); d.scale.y=1.15;
  add(parent,new THREE.ConeGeometry(r*.12,r*.5,8),GOLD,x,y+drumH+r*1.15+r*.2,z,false); return d; }
/* pointed arch opening (dark) with tiled frame, as a thin box pair */
function pishtaq(parent, w, h, x, y, z, rotY=0){ const g=new THREE.Group(); g.position.set(x,y,z); g.rotation.y=rotY; parent.add(g);
  add(g,new THREE.BoxGeometry(w,h,1.2),new THREE.MeshStandardMaterial({map:tileTex,roughness:.5}),0,h/2,0);
  add(g,new THREE.BoxGeometry(w*.5,h*.62,.5),mat('#141a26'),0,h*.31,.45,false);
  add(g,new THREE.CylinderGeometry(w*.25,w*.25,.5,16,1,false,0,Math.PI),mat('#141a26'),0,h*.62,.45,false).rotation.x=Math.PI/2; return g; }

/* ---------- ground, avenues, Anhor canal ---------- */

    g.fillStyle='#ffd9a0'; g.beginPath(); g.arc(120,150,26,0,7); g.fill();
    g.fillStyle='#1a1826'; for(let x=0;x<w;x+=16){ const bh=24+rnd()*60; g.fillRect(x,h-bh,14,bh); }
    g.fillRect(372,30,6,h); g.beginPath(); g.ellipse(375,110,22,8,0,0,7); g.fill(); g.beginPath(); g.moveTo(375,80); g.lineTo(340,h); g.lineTo(410,h); g.fill(); g.fillStyle='#ff3b3b'; g.fillRect(373,22,4,6);
    g.fillStyle='#1a1826'; g.fillRect(40,170,170,50); g.fillStyle='#ffd48a'; for(let r=0;r<5;r++) for(let c=0;c<20;c++){ if(rnd()<.5) g.fillRect(44+c*8.3,174+r*9,4,5); }
    g.fillStyle='#1fb2ad'; g.beginPath(); g.arc(270,205,22,Math.PI,0); g.fill(); g.fillStyle='#1a1826'; g.fillRect(246,205,48,60);
    for(let i=0;i<80;i++){ g.fillStyle='#ffd28a'; g.fillRect(rnd()*w, h-rnd()*60, 2, 2); } });
  add(oRoom,new THREE.PlaneGeometry(4.6,2.4),new THREE.MeshBasicMaterial({map:sky}),1.4,3.4,-5.88);
  add(oRoom,new THREE.BoxGeometry(4.9,.18,.3),mat('#5a4030'),1.4,2.15,-5.8); add(oRoom,new THREE.BoxGeometry(.12,2.5,.1),mat('#5a4030'),1.4,3.4,-5.82);
  /* desk, chair, monitor, plant, tea; a small tapchan-style bench with cushions */
  add(oRoom,new THREE.BoxGeometry(3.6,.15,1.6),mat('#8a6040',{roughness:.5}),0,1.5,-1.2);
  [[-1.6,-.5],[1.6,-.5],[-1.6,-1.9],[1.6,-1.9]].forEach(([x,z])=>add(oRoom,new THREE.BoxGeometry(.12,1.5,.12),mat('#5a4030'),x,.75,z));
  add(oRoom,new THREE.BoxGeometry(2,1.25,.08),mat('#111'),0,2.45,-1.65); add(oRoom,new THREE.PlaneGeometry(1.9,1.15),new THREE.MeshBasicMaterial({map:screenTex}),0,2.45,-1.6);
  add(oRoom,new THREE.BoxGeometry(.12,.6,.12),mat('#222'),0,1.85,-1.7);
  add(oRoom,new THREE.CylinderGeometry(.35,.28,.6,12),mat('#1d4e9e'),1.5,1.88,-1.5); add(oRoom,new THREE.SphereGeometry(.55,10,8),mat('#3f8f4f'),1.5,2.45,-1.5);
  add(oRoom,new THREE.CylinderGeometry(.12,.1,.18,12),mat('#ffffff'),-1.2,1.67,-.9); add(oRoom,new THREE.SphereGeometry(.22,12,10),mat('#1d4e9e',{metalness:.3}),-1.55,1.75,-1);
  add(oRoom,new THREE.BoxGeometry(2.4,.5,1.6),mat('#7a4a2a'),-4.2,.25,3.2); add(oRoom,new THREE.BoxGeometry(2.3,.25,1.5),new THREE.MeshStandardMaterial({map:ikatTex,roughness:.9}),-4.2,.62,3.2);
  [[-4.8,3.6],[-3.6,3.6]].forEach(([x,z])=>add(oRoom,new THREE.BoxGeometry(.7,.35,.5),mat('#c8304a'),x,.92,z));
  /* robot agent (original design): capsule body, round head with screen face, antenna, emoji badge, square do'ppi */
  robot=new THREE.Group(); robot.position.set(-1.2,0,2.2); oRoom.add(robot);
  add(robot,new THREE.CapsuleGeometry(.55,.9,6,16),mat('#f4f6f8',{metalness:.3,roughness:.35}),0,1.25,0);
  add(robot,new THREE.SphereGeometry(.62,24,18),mat('#f4f6f8',{metalness:.3,roughness:.3}),0,2.45,0);
  add(robot,new THREE.SphereGeometry(.5,24,18,0,Math.PI*2,0,Math.PI/2.2),new THREE.MeshStandardMaterial({color:'#0b1220',roughness:.2}),0,2.45,-.18).rotation.x=-Math.PI/2;
  robotEyes=[-.18,.18].map(x=>add(robot,new THREE.SphereGeometry(.09,10,8),new THREE.MeshBasicMaterial({color:'#19d3c5'}),x,2.5,-.62,false));
  add(robot,new THREE.CylinderGeometry(.03,.03,.5,6),mat('#c0c4c8'),0,3.25,0); add(robot,new THREE.SphereGeometry(.1,10,8),new THREE.MeshBasicMaterial({color:'#e3b341'}),0,3.52,0,false);
  add(robot,new THREE.PlaneGeometry(.55,.55),new THREE.MeshBasicMaterial({map:badgeTex,transparent:true}),0,1.45,-.56,false).rotation.y=Math.PI;
  const dop=canvasTex(128,128,(g,w,h)=>{ g.fillStyle='#14161a'; g.fillRect(0,0,w,h); g.fillStyle='#f4f6f8'; for(const [x,y] of [[32,32],[96,32],[32,96],[96,96]]){ g.beginPath(); g.moveTo(x,y-20); g.quadraticCurveTo(x+18,y-10,x+6,y+18); g.quadraticCurveTo(x-10,y+6,x,y-20); g.fill(); } });
  add(robot,new THREE.CylinderGeometry(.44,.42,.2,4),new THREE.MeshStandardMaterial({map:dop,roughness:.8}),0,3.0,0).rotation.y=Math.PI/4;
  add(robot,new THREE.TorusGeometry(.4,.05,8,20),mat('#f4f6f8'),0,2.92,0).rotation.x=Math.PI/2;
  add(oRoom,new THREE.BoxGeometry(1,.12,1),mat('#2c3446'),0,.75,.5); add(oRoom,new THREE.BoxGeometry(1,1.1,.12),mat('#2c3446'),0,1.3,1.0);
})();
function drawOffice(a){ const g=screenCanvas.getContext('2d'), c=ST[a.state][1]; g.fillStyle='#0b1220'; g.fillRect(0,0,512,320);
  g.fillStyle=c; g.fillRect(0,0,512,8); g.font='bold 34px Manrope, sans-serif'; g.fillStyle='#ffffff'; g.fillText(a.name.slice(0,22),24,62);
  g.font='22px Manrope, sans-serif'; g.fillStyle=c; g.fillText('● '+ST[a.state][0],24,100); g.fillStyle='#b9c6c2';
  const words=a.does.split(' '); let line='', y=145; for(const w of words){ if(g.measureText(line+w).width>460){ g.fillText(line,24,y); y+=30; line=''; } line+=w+' '; } g.fillText(line,24,y);
  g.fillStyle='#8fa3a0'; g.font='18px Manrope'; g.fillText('след. запуск: '+(a.next||'—'),24,296); screenTex.needsUpdate=true;
  const b=badgeCanvas.getContext('2d'); b.clearRect(0,0,256,256); b.fillStyle=c; b.beginPath(); b.arc(128,128,120,0,Math.PI*2); b.fill(); b.font='140px serif'; b.textAlign='center'; b.textBaseline='middle'; b.fillText(a.emoji,128,140); badgeTex.needsUpdate=true;
  robotEyes.forEach(e=>e.material.color.set(c)); }
function enterOffice(a){ inOffice=a; drawOffice(a); document.getElementById('oname').textContent=a.emoji+' '+a.name; document.getElementById('odesc').textContent=a.does+' · '+ST[a.state][0];
  office.classList.add('on'); document.body.classList.add('in-office'); panel.classList.remove('on'); L2.domElement.style.display='none'; oCam.position.set(7,6,9); oCtl.target.set(0,1.8,0); }
document.getElementById('oback').onclick=()=>{ inOffice=null; office.classList.remove('on'); document.body.classList.remove('in-office'); L2.domElement.style.display=''; openAgent(D.agents.find(x=>x.id===(panel.dataset.last||''))||D.agents[0]); panel.classList.add('on'); };

/* ---------- loop ---------- */
const clock=new THREE.Clock(), wp=new THREE.Vector3(); const spinners=[], blinkers=[], jets=[], facers=[];
scene.traverse(o=>{ if(o.userData.spin) spinners.push(o); if(o.userData.blink) blinkers.push(o); if(o.userData.jet) jets.push(o); if(o.userData.face) facers.push(o); });
function loop(){ requestAnimationFrame(loop); const t=clock.getElapsedTime();
  if(inOffice){ oCtl.update(); robot.position.y=Math.sin(t*2)*.05; robot.rotation.y=Math.PI*.78+Math.sin(t*.7)*.25; robotEyes.forEach(e=>e.scale.y=(Math.sin(t*3)>.96)?.1:1); R.render(oScene,oCam); return; }
  if(fly){ const k=Math.min(1,(performance.now()-fly.s)/fly.dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2; cam.position.lerpVectors(fly.p0,fly.p,e); ctl.target.lerpVectors(fly.t0,fly.t,e); if(k>=1) fly=null; }
  ctl.update();
  beams.forEach(b=>{ b.bm.material.opacity=b.run? .28+.18*Math.sin(t*3+b.ph) : .13; });
  arcs.forEach(a=>{ a.t=(a.t+a.v*0.016)%1; a.s.position.copy(a.cv.getPoint(a.t)); });
  spinners.forEach(o=>{ o.rotation.z+=0.01; o.rotation.y+=0.006; }); const bl=Math.sin(t*4)>0; blinkers.forEach(o=>o.visible=bl); jets.forEach(j=>j.scale.y=.85+.2*Math.sin(t*5+j.position.x));
  facers.forEach(f=>f.rotation.y=Math.atan2(cam.position.x-f.position.x,cam.position.z-f.position.z));
  water.material.emissiveIntensity=.5+.1*Math.sin(t*1.3);
  const dist=cam.position.distanceTo(ctl.target);
  agentLabels.forEach(x=>{ x.o.getWorldPosition(wp); const near=cam.position.distanceTo(wp)<72 || (focused===x.d && dist<80); x.al.element.classList.toggle('show',near); });
  lmLabels.forEach(x=>{ x.l.getWorldPosition(wp); x.l.element.classList.toggle('show', cam.position.distanceTo(wp)<110 && dist<140); });
  R.render(scene,cam); L2.render(scene,cam); }
loop();
addEventListener('resize',()=>{ [cam,oCam].forEach(c=>{ c.aspect=innerWidth/innerHeight; c.updateProjectionMatrix(); }); R.setSize(innerWidth,innerHeight); L2.setSize(innerWidth,innerHeight); });
</script>
