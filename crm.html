<style>
:root{--ink:#131313;--body:#5c5d5f;--mint:#07e7b7;--card:#f6f7f8;--line:#e6e8ea;--bg:#fff;--err:#e5484d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f2f3f4;--body:#b9bcc0;--card:#1b1d1f;--line:#2a2d30;--bg:#111213}}
:root[data-theme="dark"]{--ink:#f2f3f4;--body:#b9bcc0;--card:#1b1d1f;--line:#2a2d30;--bg:#111213}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--body);font:15px/1.5 Inter,sans-serif;padding:16px}
form{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
h1{font:800 24px Manrope,sans-serif;color:var(--ink);margin:6px 0 4px}h1 em{font-style:normal;background:var(--mint);color:#131313;padding:0 8px;border-radius:8px}
.eb{color:#05a884;letter-spacing:2.5px;font-size:11px;font-weight:700;text-transform:uppercase}
label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-top:14px}
input[type=text],input[type=password]{width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.rm{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--body)}
button{margin-top:18px;width:100%;border:0;border-radius:999px;padding:13px;background:var(--mint);color:#131313;font:700 15px Inter;cursor:pointer}
button:disabled{opacity:.6}#err{color:var(--err);min-height:20px;margin-top:10px;font-size:13px}
</style></head><body>

    const kek=await sub.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:u8(a.s),iterations:B.n},mat,{name:'AES-GCM',length:256},false,['decrypt']);
    try{const out=new Uint8Array(await sub.decrypt({name:'AES-GCM',iv:u8(a.i)},kek,u8(a.w)));return[out.slice(0,32),new TextDecoder().decode(out.slice(32))]}catch(_){}
  }
  return null;
}
